# Mode en ligne (jalon M5). Rien de ce fichier ne sert au rejeu des chapitres 6 :
# les resultats du memoire se reproduisent sans qu'aucune de ces valeurs soit
# lue. Inversement, le service en ligne n'introduit **aucun** parametre de
# detection qui lui soit propre : le modele vient de configs/model.yaml, les
# features de configs/features.yaml, la derive de configs/drift.yaml et la
# strategie de configs/strategies/proposed.yaml. Ce qui est ici est de
# l'exploitation : ou lire, ou ecrire, a quel rythme, a qui parler.

name: serving

registry:
  # Registre de modeles. L'URL depend du deploiement : MLFLOW_TRACKING_URI a la
  # priorite sur cette valeur, comme PROMETHEUS_URL pour la source serveur.
  #
  # Un chemin sqlite fonctionne aussi (sqlite:///mlflow.db) et suffit a tout
  # tester sans serveur. Le registre de modeles — donc l'alias `champion` —
  # demande un backend de base de donnees : un simple dossier `mlruns/` ne
  # suffit pas, et c'est la raison du service `mlflow` du docker-compose.
  tracking_uri: http://127.0.0.1:5000

  experiment: detection-anomalies
  model_name: detecteur-anomalies

  # L'alias qui designe le modele en service (§6, point 5). Le deplacer **est**
  # la mise en service : il n'y a pas d'autre endroit ou cette information soit
  # vraie.
  alias: champion

  # Bornes des requetes au registre. Par defaut mlflow attend 120 s et retente
  # plusieurs fois : un registre tombe bloquerait la boucle plusieurs minutes et
  # lui ferait manquer des fenetres, alors que l'intervalle de collecte est
  # d'une minute. Mieux vaut echouer vite, journaliser, et garder le champion.
  timeout_s: 10
  max_retries: 1

# Ou la boucle lit son flux et quelle strategie elle applique. Ces deux chemins
# sont ceux du rejeu : le service en ligne n'a pas de configuration de detection
# qui lui soit propre, c'est la condition pour que le chapitre 5 montre ce que
# le chapitre 6 mesure.
source: datasets/serveur.yaml
strategie: strategies/proposed.yaml

boucle:
  # Delai d'attente apres un instant de grille avant de le demander a Prometheus.
  # Un `scrape_interval` de 15 s signifie qu'un point peut arriver jusqu'a 15 s
  # apres l'instant qu'il porte : interroger sans delai rendrait un trou que la
  # boucle compterait comme une fenetre sautee.
  retard_s: 20

  # Au-dela de ce retard, la boucle ne rattrape pas : elle repart des points
  # recents et journalise `collect_gap`. Rejouer une demi-journee fenetre par
  # fenetre produirait des alertes sur des evenements passes depuis longtemps,
  # que le §7 compterait en fausses alertes. 60 points = une heure a pas de 60 s.
  rattrapage_max_points: 60

  # Fenetres passees chargees au demarrage pour remplir l'historique de
  # reentrainement. Elles ne sont **ni scorees ni alertees** : elles servent
  # uniquement a ce que le garde-fou « historique < 300 fenetres » du §6 ne
  # bloque pas tout reentrainement pendant les premieres heures de service, ni
  # apres chaque redemarrage. 400 > 300 avec de la marge.
  prefill_fenetres: 400

  # Profondeur de l'historique garde en memoire, en fenetres. Il borne ce dans
  # quoi la strategie peut puiser pour reentrainer. 20000 fenetres a pas de 60 s
  # font deux semaines, soit bien plus que la plus large fenetre W envisagee.
  historique_max_fenetres: 20000

journal:
  # Journal JSON lignes du §9, une ligne par evenement. C'est la source unique
  # que lisent l'exporter Prometheus (phase C) et les notifications Telegram
  # (phase D) : `<dossier>/<run_id>/events.jsonl`.
  dossier: results/online

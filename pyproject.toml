[project]
name = "memoire-drift"
version = "0.1.0"
description = "Detection d'anomalies en temps reel sous derive de concept : strategie de reentrainement dans un pipeline MLOps"
requires-python = "==3.11.*"
dependencies = [
    "numpy>=1.26,<2.2",
    "pandas>=2.2,<2.3",
    "scikit-learn>=1.5,<1.7",
    "scipy>=1.14,<1.16",
    "pyyaml>=6.0,<7.0",
    "typer>=0.15,<0.17",
    "matplotlib>=3.9,<3.11",
    "pyarrow>=17.0,<19.0",
    "joblib>=1.4,<2.0",
]

[project.scripts]
mdrift = "src.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.3,<9.0",
    "ruff>=0.8,<0.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

# Pile de collecte, de visualisation et de suivi (M4 phase B, M5 phase A).
#
#   cp .env.example .env   # puis renseigner GRAFANA_ADMIN_PASSWORD
#   docker compose up -d
#   docker compose ps
#
# Cible reelle : le serveur Linux de Sidy. Sur un poste Windows, `app`,
# `prometheus` et `grafana` fonctionnent ; `node-exporter` et `cadvisor` mesurent
# la machine virtuelle de Docker Desktop et non le poste, ce qui suffit a
# verifier la collecte mais pas a produire une session exploitable.
#
# Trois choix qui tiennent au §4.3 du cadrage :
#
#  1. Aucun port n'est publie sur toutes les interfaces. Tout est lie a
#     ${BIND_ADDR}, qui vaut 127.0.0.1 par defaut : sur le serveur, Grafana et
#     Prometheus ne sont pas joignables depuis Internet, et l'acces se fait par
#     un tunnel SSH. Mettre 0.0.0.0 dans .env est un choix explicite, pas un
#     defaut subi.
#  2. Les versions d'image sont epinglees (verifiees par `docker manifest
#     inspect`). `latest` rendrait une capture du memoire irreproductible.
#  3. La retention de Prometheus est bornee en duree ET en taille. Le cadrage
#     demande de surveiller l'espace disque ; une borne de taille est plus sure
#     qu'une surveillance, parce qu'elle n'a pas besoin qu'on regarde.
#
#  4. Les quatre ports publies sont des variables (APP_PORT, PROM_PORT,
#     GRAFANA_PORT, MLFLOW_PORT). Un serveur fait tourner autre chose que cette
#     experience :
#     a la premiere mise en route, le port 8000 etait deja pris par une
#     application sans rapport. Le §4.3 interdit de toucher aux conteneurs des
#     autres, donc c'est la pile du memoire qui se decale.

# Les etiquettes `memoire.role` servent a l'injecteur de la phase C : il refuse
# de toucher tout conteneur qu'il n'a pas cree lui-meme, et ces etiquettes
# permettent de montrer, a l'inspection, que les conteneurs de la pile ne
# portent pas la marque des conteneurs d'injection.

name: memoire

services:
  app:
    build:
      context: .
      dockerfile: infra/app/Dockerfile
    image: memoire-app:${APP_VERSION:-1.0.0}
    container_name: memoire-app
    restart: unless-stopped
    environment:
      # Ces trois variables DECRIVENT le deploiement courant. Les changer puis
      # relancer le service est exactement la derive S1 reelle du §5 : elles sont
      # donc dans .env (non suivi) et non dans un YAML de configs/, sinon
      # injecter une derive demanderait un commit.
      APP_VERSION: ${APP_VERSION:-1.0.0}
      APP_BASE_LATENCY_MS: ${APP_BASE_LATENCY_MS:-25}
      APP_LATENCY_SPREAD: ${APP_LATENCY_SPREAD:-0.35}
      # Le plan de controle /chaos reste ouvert par defaut : la pile n'est lancee
      # que pour l'experience. A mettre a 0 pour une demonstration en lecture seule.
      APP_CHAOS_ENABLED: ${APP_CHAOS_ENABLED:-1}
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${APP_PORT:-8000}:8000"
    # L'appli de test subit des anomalies : elle est bornee pour que sa
    # saturation reste la sienne et n'emporte pas le serveur.
    cpus: ${APP_CPUS:-1.0}
    mem_limit: ${APP_MEMORY:-512m}
    labels:
      memoire.role: appli_de_test
    networks:
      - memoire

  prometheus:
    image: prom/prometheus:v2.53.2
    container_name: memoire-prometheus
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      # Duree ET taille : voir le point 3 de l'en-tete.
      - --storage.tsdb.retention.time=${PROM_RETENTION_TIME:-15d}
      - --storage.tsdb.retention.size=${PROM_RETENTION_SIZE:-4GB}
      # Necessaire pour recharger la configuration sans redemarrer, et pour que
      # l'enregistreur de la phase D puisse interroger l'API.
      - --web.enable-lifecycle
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${PROM_PORT:-9090}:9090"
    # Memoire est un serveur de production partage (D45) : les applications
    # qui y tournent deja n'ont pas de limite memoire. Sans la sienne, c'est
    # l'un des conteneurs de la pile qui grossirait le plus en cas de fuite, et
    # Linux tuerait alors le plus gros processus de l'hote au hasard des autres
    # conteneurs plutot qu'un conteneur du memoire.
    mem_limit: ${PROM_MEMORY:-768m}
    labels:
      memoire.role: collecte
    depends_on:
      app:
        condition: service_healthy
    networks:
      - memoire

  node-exporter:
    image: prom/node-exporter:v1.8.2
    container_name: memoire-node-exporter
    restart: unless-stopped
    command:
      - --path.procfs=/host/proc
      - --path.sysfs=/host/sys
      - --path.rootfs=/host/root
      # Exclut les systemes de fichiers virtuels de Docker : sans cela, le
      # panneau « espace disque » compte des dizaines de montages jetables.
      - --collector.filesystem.mount-points-exclude=^/(dev|proc|sys|var/lib/docker/.+|run/docker/.+)($$|/)
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave
    # Aucun port publie : Prometheus l'atteint par le reseau Compose. Publier
    # 9100 exposerait les metriques de l'hote sans aucune raison, et le port est
    # souvent deja pris par un node_exporter installe sur la machine.
    expose:
      - "9100"
    # Meme raison que prometheus plus haut (D45).
    mem_limit: ${NODE_EXPORTER_MEMORY:-64m}
    labels:
      memoire.role: collecte
    networks:
      - memoire

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: memoire-cadvisor
    restart: unless-stopped
    # Le socket Docker est monte en lecture seule : cAdvisor doit lire la liste
    # des conteneurs, jamais en creer ni en arreter. Le seul composant autorise a
    # ecrire sur le socket est l'injecteur de la phase C, et il tourne sur l'hote.
    command:
      # Seuls les conteneurs nous interessent : sans --docker_only, cAdvisor
      # publie aussi les cgroups racines (/docker, /kubepods...) et le panneau
      # « par conteneur » se remplit de lignes qui ne sont pas des conteneurs.
      - --docker_only=true
      # Les etiquettes de conteneur deviennent des etiquettes Prometheus : tout
      # importer fait exploser la cardinalite. Seule `memoire.role` est utile,
      # elle permet de distinguer la pile des conteneurs d'injection.
      - --store_container_labels=false
      - --whitelisted_container_labels=memoire.role
      - --housekeeping_interval=10s
      # Metriques desactivees : aucune n'est utilisee par le tableau de bord et
      # chacune coute de la cardinalite, donc de la retention. Le disque et le
      # reseau de l'hote sont mesures par node-exporter, pas ici.
      #
      # Ce que ces panneaux demandent est le couple (name, cpu) et (name,
      # memoire). Sous Docker Desktop, cAdvisor n'arrive pas a identifier la
      # couche lecture-ecriture des conteneurs (le magasin d'images y est
      # `overlayfs` et non `overlay2`), echoue a les enregistrer et n'expose
      # alors aucune etiquette `name` : les deux panneaux « par conteneur »
      # restent vides sur un poste Windows. Desactiver `disk` ne change rien,
      # la recherche a lieu a l'enregistrement du conteneur. Sur un hote Linux
      # avec le magasin d'images par defaut, le chemin existe. A verifier au
      # premier deploiement sur le serveur ; c'est note dans l'entree M4 de
      # docs/journal.md.
      - --disable_metrics=disk,advtcp,cpu_topology,cpuset,hugetlb,memory_numa,process,referenced_memory,resctrl,sched,tcp,udp
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker/:/var/lib/docker:ro
      - /dev/disk/:/dev/disk:ro
    devices:
      - /dev/kmsg
    privileged: true
    # Sans l'espace de noms cgroup de l'hote, cAdvisor ne voit que son propre
    # cgroup et n'expose aucune etiquette `name` : les deux panneaux
    # « par conteneur » restent vides.
    cgroup: host
    # Meme raison que node-exporter, et une de plus : cAdvisor tourne privilegie,
    # son interface n'a rien a faire sur un port publie.
    expose:
      - "8080"
    # Meme raison que prometheus plus haut (D45) : privilegie et cgroup host ne
    # dispensent pas d'une limite memoire, les deux sont des sujets distincts.
    mem_limit: ${CADVISOR_MEMORY:-256m}
    labels:
      memoire.role: collecte
    networks:
      - memoire

  grafana:
    image: grafana/grafana:11.3.0
    container_name: memoire-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      # Pas de valeur par defaut : si .env n'est pas renseigne, Grafana refuse de
      # demarrer, ce qui est preferable a un mot de passe « admin » sur un
      # serveur accessible.
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:?renseigner GRAFANA_ADMIN_PASSWORD dans .env}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_AUTH_ANONYMOUS_ENABLED: "false"
      # Les captures du memoire sont prises sur ce tableau de bord ; il s'ouvre
      # directement, sans passer par la page d'accueil.
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /etc/grafana/dashboards/infrastructure.json
      GF_ANALYTICS_REPORTING_ENABLED: "false"
      GF_ANALYTICS_CHECK_FOR_UPDATES: "false"
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./infra/grafana/dashboards:/etc/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${GRAFANA_PORT:-3000}:3000"
    # Meme raison que prometheus plus haut (D45).
    mem_limit: ${GRAFANA_MEMORY:-256m}
    labels:
      memoire.role: visualisation
    depends_on:
      - prometheus
    networks:
      - memoire

  # Suivi et registre de modeles (jalon M5). Le registre repond a une question
  # que le journal d'evenements ne tranche pas : quel modele, exactement, a
  # produit cette alerte ? Et il porte l'alias `champion`, qui **est** la mise en
  # service — il n'y a pas d'autre endroit ou cette information soit vraie.
  #
  # Quatre points qui ne vont pas de soi :
  #
  #  1. Backend sqlite, pas un dossier `mlruns/`. Le registre de modeles — donc
  #     l'alias — demande une base de donnees ; un magasin de fichiers ne le
  #     fournit pas. Un seul utilisateur et quelques dizaines de versions par
  #     campagne : sqlite suffit, et ajouter un PostgreSQL serait exactement le
  #     genre de sur-construction que la regle n° 1 du cadrage interdit.
  #  2. `--serve-artifacts` avec une destination **interne** au conteneur. Sans
  #     cela, le serveur renvoie au client un chemin de systeme de fichiers qui
  #     n'existe que dans le conteneur, et le telechargement d'un modele depuis
  #     l'hote echoue sans que rien n'indique pourquoi. Avec, les artefacts
  #     passent par HTTP sous le schema `mlflow-artifacts:/` et le service de
  #     detection n'a besoin que de l'URL. C'est aussi pourquoi
  #     `registry.artifact_location` reste vide dans configs/serving.yaml.
  #  3. La version de l'image est celle du client Python (mlflow 2.22.4, epinglee
  #     dans pyproject.toml). Les deux partagent le schema de la base : les faire
  #     diverger laisserait celui des deux qui ouvre la base la migrer pour
  #     l'autre.
  #  4. Deux travailleurs gunicorn et un delai court. Le registre est sollicite
  #     une fois par fenetre au plus ; en revanche, la boucle en ligne tourne a
  #     la minute, et un serveur qui met deux minutes a repondre lui ferait
  #     manquer des fenetres. Les bornes du cote client sont dans
  #     configs/serving.yaml (timeout_s, max_retries).
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.22.4
    container_name: memoire-mlflow
    restart: unless-stopped
    command:
      - mlflow
      - server
      # 0.0.0.0 **dans** le conteneur ; la publication du port, elle, est liee a
      # ${BIND_ADDR} comme tout le reste de la pile.
      - --host=0.0.0.0
      - --port=5000
      - --backend-store-uri=sqlite:////mlflow/mlflow.db
      - --serve-artifacts
      - --artifacts-destination=/mlflow/artefacts
      - --workers=2
      - --gunicorn-opts=--timeout 60
    volumes:
      - mlflow-data:/mlflow
    ports:
      - "${BIND_ADDR:-127.0.0.1}:${MLFLOW_PORT:-5000}:5000"
    # Le registre tient la tracabilite de toute la campagne en ligne : il est
    # borne pour qu'une fuite de son cote n'emporte pas le serveur, mais plus
    # large que l'appli de test, qui elle est faite pour saturer.
    cpus: ${MLFLOW_CPUS:-1.0}
    # Abaisse de 1g a 512m (D45), en meme temps que les quatre bornes ajoutees
    # plus haut : aucun des sept conteneurs de la pile n'est plus sans
    # plafond memoire.
    mem_limit: ${MLFLOW_MEMORY:-512m}
    healthcheck:
      # L'image n'embarque pas curl ; elle embarque Python, par construction.
      test:
        - CMD-SHELL
        - python -c "import urllib.request; urllib.request.urlopen('http://localhost:5000/health')"
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s
    labels:
      memoire.role: suivi
    networks:
      - memoire

  # Service de detection en ligne (jalon M5, phase C). C'est lui qui tient la
  # cible Prometheus `detection:8001`, declaree des M4 : la configuration de
  # collecte n'a pas eu a changer entre les deux jalons.
  #
  # Quatre points qui ne vont pas de soi :
  #
  #  1. Aucun port publie sur l'hote. Prometheus atteint l'exporter par le
  #     reseau Compose, et /metrics n'a aucune raison d'etre joignable
  #     autrement : il decrit l'etat de la detection, pas une interface.
  #     L'inspecter a la main se fait par `docker compose exec`.
  #  2. Le journal va dans un volume nomme, pas dans une monture de `results/`.
  #     Il doit survivre au conteneur — c'est lui qu'on relit apres une session
  #     pour expliquer ce qui s'est passe, et la source unique du §9 — mais une
  #     monture depuis l'hote serait creee par Docker avec l'appartenance de
  #     l'hote, alors que le conteneur tourne en utilisateur non privilegie
  #     (uid 10003) : la premiere ligne de journal echouerait en « permission
  #     denied », au demarrage d'une session de demonstration. Un volume nomme
  #     herite de l'appartenance du dossier de l'image, donc du bon utilisateur.
  #     Pour recuperer le journal sur l'hote :
  #         docker compose cp detection:/srv/results/online ./results/
  #  3. `configs/` est monte en lecture seule par-dessus celui de l'image. Un
  #     reglage change sur le serveur prend effet au redemarrage du conteneur,
  #     sans reconstruire l'image ; et la monture en lecture seule garantit que
  #     le service ne peut pas reecrire une configuration suivie par git.
  #  4. `restart: unless-stopped`, comme le reste de la pile, et c'est possible
  #     precisement parce que le prechargement du §2 existe : apres un
  #     redemarrage, la boucle rattrape son historique et le garde-fou
  #     « historique < 300 fenetres » ne bloque pas les reentrainements pendant
  #     des heures. Sans ce prechargement, un redemarrage automatique aurait
  #     rendu le service inerte au moment ou il sert.
  detection:
    build:
      context: .
      dockerfile: infra/detection/Dockerfile
    image: memoire-detection:${DETECTION_VERSION:-0.1.0}
    container_name: memoire-detection
    restart: unless-stopped
    environment:
      # Dans le conteneur, les deux services voisins se joignent par leur nom.
      # Ces valeurs ont la priorite sur configs/ (datasets/serveur.yaml et
      # configs/serving.yaml), qui sont ecrites pour un poste de developpement.
      PROMETHEUS_URL: http://prometheus:9090
      MLFLOW_TRACKING_URI: http://mlflow:5000
      # Toutes les interfaces **du conteneur** : c'est Prometheus, depuis un
      # autre conteneur, qui vient collecter. Rien n'est publie sur l'hote.
      DETECTION_EXPORTER_HOST: 0.0.0.0
      DETECTION_EXPORTER_PORT: "8001"
      # Notifications : le jeton et la conversation ne passent que par
      # l'environnement (§4.3). Vides par defaut, et `telegram.actif: false`
      # dans configs/notify.yaml : la pile demarre sans eux, et le service
      # affiche « notifications desactivees » au lieu d'echouer.
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      TELEGRAM_CHAT_ID: ${TELEGRAM_CHAT_ID:-}
    volumes:
      - ./configs:/srv/configs:ro
      - detection-data:/srv/results/online
    expose:
      - "8001"
    # Borne plus large que l'appli de test : un reentrainement d'Isolation Forest
    # est le seul moment ou ce service consomme vraiment, et il ne doit pas etre
    # tue en plein milieu — un challenger a moitie entraine ne serait ni promu ni
    # rejete, et le journal n'aurait pas de `retrain_end`.
    cpus: ${DETECTION_CPUS:-1.5}
    mem_limit: ${DETECTION_MEMORY:-1g}
    labels:
      memoire.role: service_detection
    depends_on:
      prometheus:
        condition: service_started
      mlflow:
        condition: service_healthy
    networks:
      - memoire


networks:
  memoire:
    name: memoire
    driver: bridge

volumes:
  prometheus-data:
    name: memoire-prometheus-data
  grafana-data:
    name: memoire-grafana-data
  mlflow-data:
    name: memoire-mlflow-data
  detection-data:
    name: memoire-detection-data
